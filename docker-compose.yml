# ============================================================
# Single-service compose file (issue #61).
#
#   docker compose up -d
#
# Starts one `app` container that hosts the FastAPI API, the React
# dashboard, the tectonic LaTeX engine, and the asyncio supervisor
# that owns discovery / gate / tailor / apply loops. Mode lives in
# the dashboard top-bar autonomous toggle — there are no profile
# flags and no separate worker containers.
#
# The apply loop talks to the user's host Chrome over CDP at
# `host.docker.internal:9222`. Start Chrome on the host before
# enabling autonomous mode:
#
#   macOS:   open -a "Google Chrome" --args --remote-debugging-port=9222
#   Linux:   google-chrome --remote-debugging-port=9222 &
#   Windows: chrome.exe --remote-debugging-port=9222
# ============================================================

services:
  app:
    build:
      context: .
      target: app
    command: uv run --no-dev uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      # Default the CDP URL to the host gateway so the apply loop can
      # reach Chrome running on the user's machine. Operators on Linux
      # who already export CHROME_CDP_URL via `.env` win.
      CHROME_CDP_URL: ${CHROME_CDP_URL:-http://host.docker.internal:9222}
    extra_hosts:
      # Linux Docker does not resolve `host.docker.internal` natively;
      # this maps it to the host gateway so the apply loop reaches host
      # Chrome from inside the container. Mac/Windows resolve it
      # automatically but the explicit mapping is a no-op for them.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config
      - app-data:/app/data
      - app-logs:/app/logs
      - tectonic-cache:/tectonic-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 60s

volumes:
  app-data:
  app-logs:
  tectonic-cache:
