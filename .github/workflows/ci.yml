name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
  # PRs always run CI so branch protection's required checks resolve even
  # for documentation-only changes. paths-ignore on PR triggers leaves
  # required checks pending forever and blocks the merge.
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest (deterministic only)
        # Live agent tests are skipped by default; they require --run-live-agent-e2e.
        run: uv run pytest -q

      - name: Run mypy (strict)
        run: uv run mypy

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (production)
        run: npm run build
