schema_version: 1
lock_rules:
  section_order:
  - education
  - experience
  - projects
  - skills_achievements
  section_headings:
    education: Education
    experience: Experience
    projects: Projects
    skills_achievements: Skills and Achievements
  non_editable_sections:
  - personal
  - education
layout:
  margin_in: 0.5
  top_vspace_in: -0.45
  section_heading_font_size_pt: 13.0
  section_heading_line_height_pt: 15.0
  section_spacing_before_pt: 1.0
  section_spacing_after_pt: 1.0
  subheading_itemsep_pt: 2.0
  bullet_itemsep_pt: 1.0
personal:
  section_id: personal
  name: Test Candidate
  phone: 555-555-0100
  email: test.candidate@example.com
  links:
  - id: linkedin_test
    label: linkedin.com/in/test-candidate
    url: https://www.linkedin.com/in/test-candidate/
  - id: github_test
    label: github.com/test-candidate
    url: https://github.com/test-candidate
education:
  section_id: education
  heading: Education
  entries:
  - id: edu_test_university
    institution: Test University $|$ Test City
    date_range: Aug. 2023 -- May 2027
    degree: 'Bachelor of Science in Computer Science'
    detail: 'GPA: 4.0'
    bullets:
    - id: edu_test_bullet_0
      text: Relevant coursework in algorithms, data structures, and machine learning.
experience:
  section_id: experience
  heading: Experience
  listings:
  - id: exp_software_engineering_intern
    enabled: true
    title: Software Engineering Intern
    date_range: Jun. 2025 -- Aug. 2025
    organization: Acme Corp $|$ Test City
    bullets:
    - id: software_engineering_intern_bullet_0
      text: Built backend service in Python that processed 10k requests per minute and reduced latency by 25%.
    - id: software_engineering_intern_bullet_1
      text: Implemented automated testing pipeline using PyTest and GitHub Actions to improve release confidence.
projects:
  section_id: projects
  heading: Projects
  listings:
  - id: proj_open_source_cli
    enabled: true
    title: Open Source CLI Tool
    tech_stack: Python, Click, PyTest
    date_range: Jan. 2025 -- Mar. 2025
    bullets:
    - id: open_source_cli_bullet_0
      text: Designed and shipped a Python CLI tool with 200+ stars on GitHub for batch processing structured data.
    - id: open_source_cli_bullet_1
      text: Wrote comprehensive PyTest suite achieving 95% coverage and integrated CI via GitHub Actions.
skills_achievements:
  section_id: skills_achievements
  heading: Skills and Achievements
  listings:
  - id: skill_languages
    enabled: true
    category: Languages
    text: Python, TypeScript, SQL, Bash
