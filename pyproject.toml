[project]
name = "agentic-job-applier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "aiosqlite>=0.22.1,<1",
    "apify-client>=2.4.0,<3",
    "apscheduler>=3.11.2,<4",
    "authlib>=1.6.7,<2",
    "cryptography>=46.0.5,<47",
    "google-adk>=1.23.0,<2",
    "httpx>=0.28.1,<1",
    "litellm>=1.82.1,<2",
    "loguru>=0.7.3,<1",
    "markdownify>=0.14.1,<1",
    "protobuf>=6.33.5,<7",
    "pydantic>=2.12.5,<3",
    "python-dotenv>=1.2.1,<2",
    "python-jobspy>=1.1.82,<2",
    "python-multipart>=0.0.22,<1",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0,<3",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
]

[tool.uv]
override-dependencies = [
    # python-jobspy currently pins markdownify<0.14; this override keeps the
    # lockfile on a patched markdownify release while upstream catches up.
    "markdownify>=0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
