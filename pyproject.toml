[project]
name = "agentic-job-applier"
version = "0.1.0"
description = "Self-hosted, AI-driven job discovery and application pipeline with a React dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.13.3",
    "aiosqlite==0.22.1",
    "anthropic==0.104.1",
    "apscheduler==3.11.2",
    "authlib==1.6.9",
    "cryptography==46.0.6",
    "fastapi==0.123.10",
    "google-adk==1.23.0",
    "google-genai==2.7.0",
    "curl-cffi==0.15.0",
    "httpx==0.28.1",
    "instructor==1.15.1",
    "litellm==1.82.1",
    "loguru==0.7.3",
    "markdownify==1.2.2",
    "openai==2.38.0",
    "protobuf==6.33.5",
    "playwright==1.60.0",
    "pydantic==2.12.5",
    "pydantic-ai-slim[openai]==1.102.0",
    "genai-prices==0.0.61",
    "rapidfuzz==3.13.0",
    "pypdf==4.3.1",
    "python-dotenv==1.2.1",
    "python-jobspy==1.1.82",
    "python-multipart==0.0.29",
    "pyyaml==6.0.3",
    "uvicorn==0.40.0",
    "texsoup==0.3.3",
]

[dependency-groups]
dev = [
    "hypothesis==6.135.4",
    "mutmut==2.5.1",
    "mypy==2.1.0",
    "pip-audit==2.10.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "types-pyyaml==6.0.12.20250915",
]

[tool.uv]
override-dependencies = [
    # python-jobspy currently pins markdownify<0.14; this override keeps the
    # lockfile on a patched markdownify release while upstream catches up.
    "markdownify>=0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = "src/fetchers/linkedin_fetcher.py"
tests_dir = "tests/"
runner = "python -m pytest tests/test_linkedin_fetcher.py -x -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
follow_imports = "silent"
files = [
    "api",
    "src",
    "scripts",
    "tests",
]
