# ── Job Boards (Indeed, Glassdoor, LinkedIn) ─────────────────────────────────
# Powered by JobSpy — no API key required for Indeed and Glassdoor.

job_boards:
  Indeed:
    enabled: true
    search_terms:
      - "software engineer"
    locations:
      - "Remote"
    results_wanted: 25
    priority: 2

  Glassdoor:
    enabled: true
    search_terms:
      - "software engineer"
    locations:
      - "Remote"
    results_wanted: 25
    priority: 3

  LinkedIn:
    enabled: false   # Rate-limited without proxies — enable at your own risk
    search_terms:
      - "software engineer"
    locations:
      - "Remote"
    results_wanted: 25
    priority: 3


