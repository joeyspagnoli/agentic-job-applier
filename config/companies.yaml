# ── GitHub internship repos ─────────────────────────────────────────
github_repos:
  - owner: SimplifyJobs
    repo: Summer2026-Internships
    branch: dev
    json_path: .github/scripts/listings.json
    enabled: true
    max_days_old: 45
    categories:
      - "Software"
      - "AI/ML/Data"
      - "Hardware"
      - "Product"
      - "Quant"
  - owner: SimplifyJobs
    repo: New-Grad-Positions
    branch: dev
    json_path: .github/scripts/listings.json
    enabled: true
    max_days_old: 45
    categories:
      - "Software"
      - "AI/ML/Data"
      - "Hardware"
      - "Product"
      - "Quant"
  - owner: vanshb03
    repo: Summer2027-Internships
    branch: dev
