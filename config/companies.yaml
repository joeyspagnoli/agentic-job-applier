# NOTE: digest categories are no longer stamped per-board — the digest
# classifies every job by title at render time (src/digest/categorize.py).
# skip_job_filter was removed from business boards: early-career program
# titles (Summer Analyst, Trainee, Rotational, ...) now pass the normal
# filter pipeline via filters.yaml require_title_patterns, so business
# sources get the same seniority/location protections as everything else.
job_boards:
  Indeed:
    enabled: true
    locations:
      - "Remote"
      - "United States"
    results_wanted: 25
    priority: 2

  Indeed_Business:
    site_name: indeed
    enabled: true
    locations:
      - "Tampa, FL"
      - "Orlando, FL"
      - "Miami, FL"
      - "Dallas, TX"
      - "Houston, TX"
      - "Austin, TX"
      - "New York, NY"
      - "Los Angeles, CA"
      - "San Francisco, CA"
    search_terms:
      - "Summer 2027 Analyst"
      - "Investment Banking Summer Analyst"
      - "Finance Intern"
      - "Accounting Intern"
      - "Real Estate Analyst Intern"
      - "Acquisitions Analyst Intern"
      - "Capital Markets Analyst Intern"
      - "Financial Analyst entry level"
      - "Commercial Banking Analyst Program"
      - "Supply Chain Intern"
      - "Operations Analyst entry level"
      - "Finance Leadership Development Program"
      - "Management Trainee finance"
      - "Rotational Analyst Program"
    results_wanted: 15
    priority: 3

  Indeed_Design:
    site_name: indeed
    enabled: true
    locations:
      - "Remote"
      - "United States"
    search_terms:
      - "Product Design Intern"
      - "UX Design Intern"
      - "UI UX Designer Intern"
      - "Product Designer New Grad"
      - "UX Designer New Grad"
    results_wanted: 15
    priority: 3

  Glassdoor:
    enabled: false
    locations:
      - "Remote"
    results_wanted: 25
    priority: 3

  LinkedIn:
    enabled: false
    locations:
      - "Remote"
    results_wanted: 25
    priority: 3


adzuna:
  enabled: false
  country: "us"
  locations:
    - "Remote"
  results_wanted: 50


# ── GitHub internship repos ─────────────────────────────────────────
# No `categories` filter: fetch every listing the trackers carry (incl.
# Simplify's "Other", where design roles land) — the digest's title-based
# classifier decides what each subscriber sees. Dropping categories at
# fetch time silently threw away listings the free board shows everyone.
github_repos:
  - owner: SimplifyJobs
    repo: Summer2026-Internships
    branch: dev
    json_path: .github/scripts/listings.json
    enabled: true
    max_days_old: 45
  # Does not exist yet (checked 2026-07-02) — Simplify creates the new
  # cycle repo around August. The fetcher tolerates the 404 and this
  # entry starts producing the moment the repo appears, so we never lag
  # the cycle rollover.
  - owner: SimplifyJobs
    repo: Summer2027-Internships
    branch: dev
    json_path: .github/scripts/listings.json
    enabled: true
    max_days_old: 45
  - owner: SimplifyJobs
    repo: New-Grad-Positions
    branch: dev
    json_path: .github/scripts/listings.json
    enabled: true
    max_days_old: 45
  - owner: vanshb03
    repo: Summer2027-Internships
    branch: dev
    json_path: .github/scripts/listings.json
    enabled: true
    max_days_old: 45


# ── Direct LinkedIn scraping ────────────────────────────────────────
linkedin:
  enabled: true
  searches: []
  time_range_seconds: 604800
  max_pages: 2
  fetch_descriptions: false
  danger:
    aggressive_mode: false
    aggressive_time_range: 3600
    aggressive_max_pages: 10
    proxy_url: ""


# ── Career page watchers ────────────────────────────────────────────
watched_pages: []


# ── Polling intervals (minutes) ─────────────────────────────────────
polling:
  greenhouse_interval_minutes: 30
  lever_interval_minutes: 30
  ashby_interval_minutes: 30
  workday_interval_minutes: 60
  jobspy_interval_minutes: 60
  linkedin_interval_minutes: 60
  # Hourly: the digest promises to be on top of the Simplify trackers, and
  # a raw.githubusercontent.com fetch per repo is nearly free.
  github_repos_interval_minutes: 60
  career_pages_interval_minutes: 60
