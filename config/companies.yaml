job_boards:
  Indeed:
    enabled: true
    search_terms:
      - "software engineering internship"
      - "machine learning internship"
      - "backend engineering internship"
    locations:
      - "Remote"
      - "San Francisco, CA"
      - "New York, NY"
    results_wanted: 25
    priority: 2

  Glassdoor:
    enabled: true
    search_terms:
      - "software engineering internship"
      - "ai internship"
    locations:
      - "Remote"
    results_wanted: 25
    priority: 3

  LinkedIn:
    enabled: false  # Requires proxies - enable when ready
    search_terms:
      - "software engineering internship"
    locations:
      - "Remote"
    results_wanted: 25
    priority: 3
