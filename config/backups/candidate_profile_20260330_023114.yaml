# Candidate profile used by the root gate prompt and search defaults.
# Customize this file to match your own background and target roles.

profile:
  summary: "Current computer science student targeting technical internships."
  contact:
    full_name: ""
    email: ""
    phone: ""
    city: ""
    state_or_region: ""
    country_code: "US"
    country_label: "United States"
    linkedin_url: ""
    github_url: ""
    portfolio_url: ""
  work_authorization:
    citizenship_country_code: "US"
    citizenship_country_label: "United States"
    authorized_to_work_us: "yes"
    requires_sponsorship_now_or_future: "no"
  education_summary: "BS in Computer Science in progress"
  education_entries:
    - id: "uf-bs-cs"
      school: "University of Florida"
      degree_level: "BS"
      degree_name: "Computer Science"
      field_of_study: ""
      start_month: ""
      start_year: ""
      end_month: ""
      end_year: ""
      is_current: true
      gpa: ""
      location: ""
      highlights: []

  target_roles:
    - "Software Engineering Internship"
    - "Machine Learning Internship"
    - "AI Engineering Internship"
    - "MLOps Internship"

  strongest_areas:
    - "Python"
    - "Backend engineering"
    - "Machine learning"
    - "MLOps"
    - "Cloud platforms"

  experience_highlights:
    - "Built backend APIs and data processing services"
    - "Shipped ML and AI projects from prototype to deployment"
    - "Worked with Docker and cloud infrastructure"

  hard_filters:
    - "US roles only"
    - "Internship/co-op/student roles only"
    - "No primarily frontend-only roles"
    - "No IT/helpdesk/support roles"
    - "No embedded-only roles"
    - "No defense/clearance-required roles"

  preferences:
    - "Prefer ML, AI, and MLOps internships"
    - "Allow general backend/software engineering internships"
    - "Bias toward APPLY when role is aligned and no hard filter is violated"
    - "If compensation is listed, prefer >= $25/hour"

search_defaults:
  job_board_search_terms:
    - "software engineering internship"
    - "machine learning internship"
    - "ai internship"
    - "mlops internship"
    - "backend engineering internship"
