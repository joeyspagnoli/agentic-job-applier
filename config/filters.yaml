hard_filters:
  min_salary_usd: 0
  max_salary_usd: 0
  require_remote: false
  exclude_companies:
    - NVIDIA
  # Seniority markers reject outright everywhere the JobFilter runs —
  # including the curated GitHub-tracker path, which skips the
  # require_title_patterns gate below and would otherwise let senior
  # roles through.
  exclude_title_patterns:
    - "(?i)\\bsenior\\b"
    - "(?i)\\bsr\\.?\\b"
    - "(?i)\\bstaff\\b"
    - "(?i)\\bprincipal\\b"
    - "(?i)\\bdirector\\b"
    - "(?i)\\bvp\\b|vice president"
    - "(?i)head of"
    - "(?i)\\bchief\\b"
  exclude_job_types: []
  # Early-career markers. The business-program forms (summer analyst,
  # trainee, rotational, ...) let banking/CRE sources run through the
  # normal filter pipeline instead of skip_job_filter, which used to
  # bypass every protection at once.
  require_title_patterns:
    - "(?i)\\bintern(ship)?s?\\b"
    - "(?i)\\bco-?op\\b"
    - "(?i)\\bnew.?grad\\b"
    - "(?i)\\bstudent\\b"
    - "(?i)\\bearly.?career\\b"
    - "(?i)entry.?level"
    - "(?i)\\btrainee\\b"
    - "(?i)\\brotational\\b"
    - "(?i)summer analyst"
    - "(?i)analyst program"
    - "(?i)development program"
    - "(?i)leadership development"
  exclude_locations:
    - "Canada"
    - "Toronto"
    - "Montreal"
    - "Vancouver"
    - "Ontario"
    - "Waterloo"
    - ", UK"
    - "London, UK"
    - "United Kingdom"
    - "Singapore"
    - ", Australia"
    - "Sydney, AU"
    - "Sydney"
    - "Berlin"
    - "London"
    - "Munich"
    - "Paris"
    - "Lisbon"
    - "Dublin"
    - "Amsterdam"
    - "Stockholm"
    - "Copenhagen"
    - "Zurich"
    - "Vienna"
    - "Prague"
    - "Warsaw"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Chennai"
    - "Gurgaon"
    - "Noida"
    - ", Brazil"
    - ", India"
    - ", Japan"
    - ", Germany"
    - ", France"
    - ", Italy"
    - ", Spain"
    - ", Sweden"
    - ", Ireland"
    - ", Netherlands"
    - "Korea"
    - "Belgrade"
    - "Colombia"
    - "Mexico City"
    - "Hong Kong"
    - "Tel Aviv"
    - "Taipei"
    - "Shanghai"
    - "Beijing"
    - "Manila"
  max_days_old: 30
soft_filters:
  positive_keywords:
    - "Python"
    - "AI"
    - "machine learning"
    - "agentic"
    - "LLM"
    - "deep learning"
    - "MLOps"
    - "backend"
    - "solutions engineer"
    - "forward deployed"
    - "cloud"
    - "infrastructure"
  negative_keywords:
    - "clearance required"
    - "security clearance"
    - "3+ years"
    - "4+ years"
    - "5+ years"
    - "6+ years"
    - "7+ years"
    - "8+ years"
    - "10+ years"
    - "help desk"
    - "it support"
