channels:
  - type: ntfy
    topic: ${NTFY_TOPIC}
    server: ${NTFY_SERVER}
    token: ${NTFY_TOKEN}
    default_priority: default

# Companies to send push notifications for when new jobs are discovered.
# Case-insensitive substring match (e.g., "Google" matches "Google DeepMind").
# One consolidated notification per discovery cycle — no notification if no matches.

watch_companies:
  # ── AI Labs ──
  - Anthropic
  - OpenAI
  - Cohere
  - Mistral
  - xAI
  - Cursor
  - Perplexity
  - Cognition
  - Sierra
  - Midjourney
  - ElevenLabs
  - Character.ai
  - Runway
  # ── AI Infra ──
  - Cerebras
  - Groq
  - Figure AI
  - Together AI
  - Fireworks AI
  - CoreWeave
  - Physical Intelligence
  - Etched
  - GenBio AI
  - Helm AI
  # ── Forward Deployed / Enterprise AI ──
  - Palantir
  - Databricks
  - Glean
  - Scale AI
  - Hebbia
  - Replit
  # ── Big Tech ──
