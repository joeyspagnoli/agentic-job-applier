# Exclude jobs whose titles match any of these patterns (case-insensitive).
# Keeps notifications focused on engineering/AI roles.
exclude_title_patterns:
  - "(?i)\\bfinance\\b"
  - "(?i)\\baccounting\\b"
  - "(?i)\\b(human resources|\\bhr\\b)"
  - "(?i)\\brecruit(er|ing|ment)\\b"
  - "(?i)\\blegal\\b"
  - "(?i)\\bsales\\b"
  - "(?i)\\bmarketing\\b"
  - "(?i)\\boperations\\b"
  - "(?i)\\bcommunications\\b"
  - "(?i)\\bpolicy\\b"
  - "(?i)\\bcompliance\\b"
  - "(?i)\\bparalegal\\b"
  - "(?i)\\bprocurement\\b"
