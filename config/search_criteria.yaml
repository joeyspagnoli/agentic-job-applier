# Search criteria and filtering rules for job discovery
# Note: Filtering is primarily for Phase 2, but criteria is defined here

# Title must match at least one of these patterns to be stored (case-insensitive regex).
# Remove or leave empty to disable pre-storage title filtering.
include_title_patterns:
  - "intern"        # intern, internship, internships
  - "co-op"         # co-op, co-ops
  - "coop"          # coop
  - "new.?grad"     # new grad, new-grad, new graduate
  - "early.?career" # early career, early-career
  - "student"       # student researcher, student developer

# Job titles to search for on job boards.
# Leave empty — search terms are driven by candidate_profile.yaml search_defaults.job_board_search_terms.
# Adding terms here appends them to every user's searches regardless of their domain.
target_titles: []

# Titles to exclude (regex patterns - case insensitive)
exclude_title_patterns:
  - "(?i)senior"
  - "(?i)staff"
  - "(?i)principal"
  - "(?i)manager"
  - "(?i)director"
  - "(?i)vp|vice president"
  - "(?i)head of"
  - "(?i)chief"
  - "(?i)recruiter"
  - "(?i)sales"
  - "(?i)marketing"
  - "(?i)support"

# Location preferences
locations:
  remote_preference: "remote_only"  # "remote_only", "hybrid_ok", "any"
  acceptable_cities:
    - "San Francisco"
    - "New York"
    - "Austin"
    - "Seattle"
    - "Remote"
    - "Anywhere"

# Salary expectations (for filtering in Phase 2)
salary:
  min: 25
  max: 80
  currency: "USD"

# Experience level
experience:
  min_years: 0
  max_years: 2

# Company size preferences
company_size:
  min_employees: 10
  max_employees: 10000  # Avoid mega-corps unless specifically targeted

# Keywords to look for in descriptions (positive signals)
positive_keywords:
  - "intern"
  - "internship"
  - "co-op"
  - "student"
  - "python"
  - "ml"
  - "machine learning"
  - "ai"
  - "backend"
  - "distributed systems"
  - "aws"
  - "gcp"
  - "remote"

# Keywords to avoid (negative signals)
negative_keywords:
  - "clearance required"
  - "security clearance"
  - "full-time only"
  - "5+ years"
  - "7+ years"
  - "help desk"
  - "it support"
