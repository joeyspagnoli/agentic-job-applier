# Search criteria for job discovery.
#
# Most users should leave this file alone — the active filter source is
# config/filters.yaml, and per-board search terms come from
# config/candidate_profile.yaml (search_defaults.job_board_search_terms).
#
# This file remains for compatibility with code paths that still consult
# include_title_patterns / exclude_title_patterns directly.

# Title must match at least one of these patterns to be stored (case-insensitive
# regex). Empty = no pre-storage title filtering.
include_title_patterns: []

# Job titles to search for on job boards. Empty = use candidate_profile's
# search_defaults.job_board_search_terms instead.
target_titles: []

# Titles to exclude (case-insensitive regex). Mirrors filters.yaml's
# hard_filters.exclude_title_patterns; kept here for legacy callers.
exclude_title_patterns:
  - "(?i)recruiter"
  - "(?i)sales"
  - "(?i)marketing"
  - "(?i)support"

# Negative description keywords for legacy filter callers. The active list
# lives in filters.yaml's soft_filters.negative_keywords.
negative_keywords:
  - "clearance required"
  - "security clearance"
